name: Validate website

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate static website
        run: |
          python -m pip install -r .github/scripts/requirements.txt
          python .github/scripts/build_site.py --output "$RUNNER_TEMP/site"
          python .github/scripts/check_site.py --root "$RUNNER_TEMP/site"
      - name: Check navigation script syntax
        run: node --check assets/js/site.js
