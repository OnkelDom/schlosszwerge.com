name: Deploy to Hetzner

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate static website
        run: |
          python -m pip install -r .github/scripts/requirements.txt
          python .github/scripts/build_site.py --output "$RUNNER_TEMP/site"
          python .github/scripts/check_site.py --root "$RUNNER_TEMP/site"

      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy static site via SFTP
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_TARGET_DIR: ${{ secrets.HETZNER_TARGET_DIR }}
        run: |
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_PORT"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_PASSWORD"
          test -n "$HETZNER_TARGET_DIR"

          build_dir="$RUNNER_TEMP/site"
          lftp -u "$HETZNER_USER","$HETZNER_PASSWORD" -p "$HETZNER_PORT" sftp://"$HETZNER_HOST" <<EOF
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose "$build_dir"/ "$HETZNER_TARGET_DIR"/
          bye
          EOF
